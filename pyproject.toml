[project]
name = "dinoplay"
version = "0.1.0"
description = "Sandbox for experimenting with Meta DINO vision models on local image folders."
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "pillow>=10.0",
    "numpy>=1.26",
    "gradio>=4.20",
    "safetensors>=0.4",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dinoplay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: tests that load real model weights (deselected by default; run with `pytest -m slow`)",
]
